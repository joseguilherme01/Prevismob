name: CI - Testes da API

on:
  push:
    branches: [ "main", "v2" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  testes:
    name: Testes (pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      PYTHONUNBUFFERED: "1"
      PIP_DISABLE_PIP_VERSION_CHECK: "1"

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            requirements.txt
            requirements-train.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip setuptools wheel
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          if [ -f requirements-train.txt ]; then pip install -r requirements-train.txt; fi
          python -m pip show pytest >/dev/null 2>&1 || pip install pytest

      - name: Preparar arquivo .env para CI
        run: |
          if [ -f .env ]; then
            echo ".env já existe"
          elif [ -f .env.example ]; then
            cp .env.example .env
            echo ".env criado a partir de .env.example"
          else
            cat > .env << 'EOF'
            APP_ENV=development
            SMTP_DEV_MODE=1
            JWT_SECRET_KEY=ci-secret-key
            EOF
            echo ".env mínimo criado para CI"
          fi

      - name: Versões instaladas (debug)
        run: |
          python --version
          pip --version
          pip show fastapi starlette httpx pytest || true

      - name: Rodar testes
        env:
          APP_ENV: development
          SMTP_DEV_MODE: "1"
          JWT_SECRET_KEY: ci-secret-key
        run: pytest -q -ra --tb=short --color=yes